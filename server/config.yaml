server:
  host: 0.0.0.0
  port: 8000

timezone: Asia/Kolkata

esp32:
  stale_after_s: 3
  heartbeat_s: 1

gate:
  hold_ms: 5000
  cooldown_s: 8
  rearm_empty_s: 1.0

entered_warn_s: 120

pricing:
  first_hour_fee: 40.0         # First hour rate in INR
  additional_hourly_rate: 20.0 # Rate per additional hour in INR
  base_fee: 40.0               # Backward compatibility alias
  hourly_rate: 20.0            # Backward compatibility alias
  grace_period_min: 0.0        # Grace period in minutes
  currency: "INR"

vision:
  model: vision/best.onnx
  device: cpu
  imgsz: 640
  max_fps: 10
  stable_frames: 5
  min_conf: 0.70
  min_box_px: 24

camera:
  # Camera Mode:
  #   "dual"   -> 2 dedicated USB webcams (one at Entry lane, one at Exit lane - RECOMMENDED)
  #   "single" -> 1 overhead camera or phone stream split into Entry & Exit ROIs
  mode: "dual"

  # --- Dual USB Webcam Setup (Entry & Exit Lanes) ---
  entry:
    # Camera index on Windows (e.g. 0 on Desktop, or 1 if laptop has built-in webcam) or IP stream URL
    source: 0
    backend: dshow
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
    roi: [100, 100, 1080, 520]

  exit:
    # Camera index on Windows (e.g. 1 on Desktop, or 2 if laptop has built-in webcam) or IP stream URL
    source: 1
    backend: dshow
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
    roi: [100, 100, 1080, 520]

  # --- Single Overhead Camera / Phone Stream Fallback ---
  single:
    source: "http://192.168.29.62:8080/video"
    backend: auto
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
    entry_roi: [440, 160, 400, 400]
    exit_roi: [840, 160, 400, 400]

  # Top-level backward compatibility aliases
  source: 0
  entry_roi: [440, 160, 400, 400]
  exit_roi: [840, 160, 400, 400]
