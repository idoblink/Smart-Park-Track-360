server:
  host: 0.0.0.0
  port: 8000

timezone: Asia/Kolkata

esp32:
  port: auto                  # Auto-detects COM3 or CP210x/CH340 USB Serial
  baud: 115200
  stale_after_s: 5
  heartbeat_s: 1

gate:
  hold_ms: 5000
  cooldown_s: 8
  rearm_empty_s: 1.0

entered_warn_s: 120

pricing:
  base_hours: 3.0              # First 3 hours covered under base fee
  base_fee: 50.0               # 50 INR for 3 hours
  additional_hourly_rate: 20.0 # 20 INR per extra hour after 3 hours
  first_hour_fee: 50.0         # Alias for backward compatibility
  hourly_rate: 20.0            # Alias for backward compatibility
  grace_period_min: 0.0        # Grace period in minutes
  currency: "INR"

razorpay:
  enabled: true
  key_id: "rzp_test_TzJBfZwN0WuEpn"
  key_secret: "MqSzY0DpGycF7ltZeVHLrFmx"
  merchant_name: "ParkTrack 360"
  upi_id: "parktrack360@okaxis"

vision:
  model: server/digit_classifier.pkl
  device: cpu
  imgsz: 640
  max_fps: 10
  stable_frames: 3
  min_conf: 0.75
  min_paper_contrast: 25
  min_paper_brightness: 100

camera:
  # Camera Mode:
  #   "dual"   -> 2 dedicated USB webcams (one at Entry lane, one at Exit lane - RECOMMENDED)
  #   "single" -> 1 overhead camera or phone stream split into Entry & Exit ROIs
  mode: "dual"

  # --- Dual USB Webcam Setup (Entry & Exit Lanes) ---
  entry:
    # Camera index on Windows (Index 2 is Entry USB webcam)
    source: 2
    backend: dshow
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    roi: [50, 50, 540, 380]

  exit:
    # Camera index on Windows (Index 1 is Exit USB webcam)
    source: 1
    backend: dshow
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    roi: [50, 50, 540, 380]

  # --- Single Overhead Camera / Phone Stream Fallback ---
  single:
    source: "http://192.168.29.62:8080/video"
    backend: auto
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
    entry_roi: [440, 160, 400, 400]
    exit_roi: [840, 160, 400, 400]

  # Top-level backward compatibility aliases
  source: 0
  entry_roi: [440, 160, 400, 400]
  exit_roi: [840, 160, 400, 400]
